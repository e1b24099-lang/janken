<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>Janken</title>
</head>

<body>
  <a href="/logout">ログアウト</a>
  <h1>Janken GAME!</h1>
  <p th:if="${username}">Hi [[${username}]]</p>

  <h2>エントリー</h2>
  <ul>
    <li th:each="user : ${users}">[[${user.name}]]</li>
  </ul>

  <a href="/jankengame?hand=Gu">ぐー</a>
  <a href="/jankengame?hand=Choki">ちょき</a>
  <a href="/jankengame?hand=Pa">ぱー</a>

  <p th:if="${myHand}">あなたの手 [[${myHand}]] </p>
  <p th:if="${cpuHand}">相手の手 [[${cpuHand}]] </p>
  <p th:if="${result}">結果 [[${result}]] </p>
</body>

</html>
