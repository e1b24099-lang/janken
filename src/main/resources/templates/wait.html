<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>Wait</title>
</head>

<body>
  <a href="/logout">ログアウト</a>
  <h1>Wait</h1>
  <p>Hi [[${username}]]</p>
  <p>相手の手を待ってます</p>

  <!-- 試合結果が出たらここに非同期で表示する -->
  <div id="result"></div>

  <script>
    // /result とつなぎっぱなしにして，サーバから試合結果が送られてくるのを待つ
    const sse = new EventSource('/result');
    sse.onmessage = function (event) {
      const match = JSON.parse(event.data); // 送られてきた Match を JavaScript のオブジェクトにする
      document.getElementById('result').innerHTML =
        '<h2>対戦結果</h2>' +
        '<p>user1:' + match.user1 + ' の手 ' + match.user1Hand + '</p>' +
        '<p>user2:' + match.user2 + ' の手 ' + match.user2Hand + '</p>' +
        '<a href="/janken">戻る</a>';
      sse.close(); // 結果を受け取ったので接続を閉じる
    };
  </script>
</body>

</html>
